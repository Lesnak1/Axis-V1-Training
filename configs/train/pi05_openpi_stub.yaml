train:
  codebase: openpi
  config_name: pi05_axis_clean_local_droid_lora
  model: pi05_droid_lora
  dataset_root: ${AXIS_CLEAN_ROOT:-datasets/axis_clean}
  base_checkpoint: pi05_droid

  source_action_dim: 9
  droid_action_dim: 8
  model_action_dim: 32
  action_padding: pad_right_zero
  source_fps: 30
  train_fps: 15
  downsample_ratio: 2
  velocity_scale: 0.06666666666666667

  batch_size: 8
  num_train_steps: 20000
  save_interval: 1000
  eval_interval: null
  fsdp_devices: 4
  num_workers: 0

  optimizer:
    lr: 5.0e-5
    weight_decay: 0.0
    clip_gradient_norm: 1.0

  precision: bf16
  seed: 42

notes:
  - Clean LeRobot-v3 source remains 9D qpos; the OpenPI loader adapts it to official DROID-style 8D state/action online.
  - Pi0.5 keeps model_action_dim 32; OpenPI PadStatesAndActions pads DROID 8D state/action inside model transforms.
  - The default config reuses official pi05_droid checkpoint and DROID norm stats, matching OpenPI fine-tuning guidance.
  - Run training/run_train_openpi.sh after applying the Axis clean config to the OpenPI checkout.
